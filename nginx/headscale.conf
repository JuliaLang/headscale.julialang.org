# Proxy everything over http to headscale on the host.
# See https://headscale.net/stable/ref/integration/reverse-proxy/#nginx for details.

map $http_upgrade $connection_upgrade {
    default     keep-alive;
    ''          close;
}

upstream headscale {
    zone upstreams 64K;
    server 127.0.0.1:8443 max_fails=1 fail_timeout=5s;
    keepalive 2;
}

server {
    # Listen to port 443 on both IPv4 and IPv6.
    listen      443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # Domain name this server responds to
    server_name ${HEADSCALE_FQDN};

    # Logging in the vhost format
    access_log /var/log/nginx/access.log vhost;

    # Load certificates
    ssl_certificate     /etc/letsencrypt/live/${HEADSCALE_FQDN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${HEADSCALE_FQDN}/privkey.pem;

    location / {
        proxy_pass http://headscale;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $server_name;
        proxy_redirect http:// https://;
        proxy_buffering off;
        proxy_set_header True-Client-IP $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
    }
}
